steps:
  # 1. Build imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'cltiene-mundial-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend:latest'
      - '.'

  # 2. Push imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend'

  # 3. Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cltiene-mundial-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--env-vars-file'
      - 'cltiene-mundial-backend/env.yaml'
      - '--add-cloudsql-instances'
      - 'desarrollo-investigaciones:us-central1:cltiene-mundial-db'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '60'
      - '--concurrency'
      - '80'

images:
  - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
