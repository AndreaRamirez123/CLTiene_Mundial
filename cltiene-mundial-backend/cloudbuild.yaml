steps:
  # Build imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'cltiene-mundial-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend'
      - '.'

  # Push imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend'

  # Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cltiene-mundial-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--env-vars-file'
      - 'cltiene-mundial-backend/.env.production'
      - '--add-cloudsql-instances'
      - 'desarrollo-investigaciones:us-central1:cltiene-mundial-db'

  # Redirigir trafico a la revision mas reciente
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'cltiene-mundial-backend'
      - '--to-latest'
      - '--region'
      - 'us-central1'

images:
  - 'us-central1-docker.pkg.dev/desarrollo-investigaciones/backend-repo/cltiene-mundial-backend'

options:
  logging: CLOUD_LOGGING_ONLY